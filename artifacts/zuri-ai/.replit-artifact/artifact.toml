kind = "web"
previewPath = "/"
title = "Zuri AI"
version = "1.0.0"
id = "artifacts/zuri-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22791

[services.development]
run = "pnpm --filter @workspace/zuri-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zuri-ai", "run", "build" ]
publicDir = "artifacts/zuri-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22791"
BASE_PATH = "/"
