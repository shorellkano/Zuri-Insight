kind = "web"
previewPath = "/"
title = "Zuri AI"
version = "1.0.0"
id = "artifacts/zuri-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22791

[services.development]
run = "pnpm --filter @workspace/zuri-ai run dev"

[services.production]

[services.production.build]
args = ["pnpm", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "22791"
BASE_PATH = "/"
